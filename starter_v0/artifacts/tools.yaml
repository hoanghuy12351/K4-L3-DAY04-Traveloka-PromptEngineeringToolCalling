tools:
  - name: clarify
    description: Ask the user for missing travel details or explicit confirmation before a mock booking request.
    parameters:
      type: object
      properties:
        question: {type: string, description: The question to ask the user.}
        response_type: {type: string, enum: [text, yes_no, choice], default: text, description: Expected response format.}
        options: {type: array, items: {type: string}, default: [], description: Options for a choice question.}
      required: [question]

  - name: search_destinations
    description: Recommend fictional local destinations by interest and budget. Use canonical city codes in results; optionally filter by region.
    parameters:
      type: object
      properties:
        interests: {type: array, items: {type: string}, description: "Travel interests such as beach, family, nature, or food."}
        budget_level: {type: string, enum: [low, medium, high], description: Requested budget level.}
        top_k: {type: integer, default: 5, minimum: 1, description: Maximum result count.}
        region: {type: string, enum: [north, south, central, central_highlands], description: Optional destination region.}
      required: [interests, budget_level]

  - name: search_transport
    description: Search fictional local transport by canonical origin and destination codes. travel_date is required request context, not live date-specific inventory.
    parameters:
      type: object
      properties:
        origin: {type: string, description: "Canonical origin city code: HAN, SGN, DAD, DLI, or PQC."}
        destination: {type: string, description: "Canonical destination city code: HAN, SGN, DAD, DLI, or PQC."}
        travel_date: {type: string, description: Requested travel date in YYYY-MM-DD.}
        passengers: {type: integer, minimum: 1, description: Number of travelers.}
        mode: {type: string, enum: [all, flight, train, bus], default: all, description: Transport mode.}
        max_price: {type: integer, minimum: 0, description: Optional maximum fictional per-person price in VND.}
        top_k: {type: integer, minimum: 1, default: 10, description: Maximum result count.}
      required: [origin, destination, travel_date, passengers]

  - name: search_hotels
    description: Search fictional local hotels by canonical destination code. Check-in and check-out are required request context; static availability is not real date-specific inventory.
    parameters:
      type: object
      properties:
        destination: {type: string, description: "Canonical destination city code: HAN, SGN, DAD, DLI, or PQC."}
        check_in: {type: string, description: Check-in date in YYYY-MM-DD.}
        check_out: {type: string, description: Check-out date in YYYY-MM-DD.}
        guests: {type: integer, minimum: 1, description: Number of guests.}
        max_price_per_night: {type: integer, minimum: 0, description: Optional maximum fictional VND price per room per night.}
        min_rating: {type: number, minimum: 0, description: Optional minimum fictional rating.}
        amenities: {type: array, items: {type: string}, description: Optional required amenities.}
        top_k: {type: integer, minimum: 1, default: 10, description: Maximum result count.}
      required: [destination, check_in, check_out, guests]

  - name: search_attractions
    description: Search fictional local attractions by canonical destination code and interests.
    parameters:
      type: object
      properties:
        destination: {type: string, description: "Canonical destination city code: HAN, SGN, DAD, DLI, or PQC."}
        interests: {type: array, items: {type: string}, description: Travel interests to match.}
        max_price: {type: integer, minimum: 0, description: Optional maximum fictional attraction price in VND.}
        top_k: {type: integer, minimum: 1, default: 10, description: Maximum result count.}
      required: [destination, interests]

  - name: calculate_trip_budget
    description: Calculate a deterministic fictional trip budget in VND. Use this tool rather than calculating the total yourself.
    parameters:
      type: object
      properties:
        transport_cost_per_person: {type: integer, minimum: 0, description: Round-trip or supplied transport cost per traveler.}
        hotel_price_per_night: {type: integer, minimum: 0, description: Hotel price per night.}
        nights: {type: integer, minimum: 0, description: Number of nights.}
        attraction_cost_per_person: {type: integer, minimum: 0, description: Total attraction cost per traveler.}
        daily_food_cost_per_person: {type: integer, minimum: 0, description: Food cost per traveler per day.}
        days: {type: integer, minimum: 1, description: Number of days.}
        travelers: {type: integer, minimum: 1, description: Number of travelers.}
      required: [transport_cost_per_person, hotel_price_per_night, nights, attraction_cost_per_person, daily_food_cost_per_person, days, travelers]

  - name: build_itinerary
    description: Build a fictional day-by-day itinerary using only local attraction records and canonical destination codes.
    parameters:
      type: object
      properties:
        destination: {type: string, description: "Canonical destination city code: HAN, SGN, DAD, DLI, or PQC."}
        start_date: {type: string, description: Itinerary start date in YYYY-MM-DD.}
        days: {type: integer, minimum: 1, description: Number of itinerary days.}
        travelers: {type: integer, minimum: 1, description: Number of travelers.}
        interests: {type: array, items: {type: string}, description: "Travel interests such as beach, family, nature, or food."}
        daily_budget: {type: integer, minimum: 0, description: Optional maximum daily fictional budget in VND.}
      required: [destination, start_date, days, travelers, interests]

  - name: create_booking_request
    description: Create a simulated booking request only after explicit confirmation of this exact payload. It never makes a real reservation or payment.
    parameters:
      type: object
      properties:
        booking_type: {type: string, enum: [hotel, transport], description: Type of local mock record to request.}
        option_id: {type: string, description: Local hotel_id or transport option_id.}
        start_date: {type: string, description: Start or travel date in YYYY-MM-DD.}
        end_date: {type: string, description: End date in YYYY-MM-DD; required for hotel requests.}
        travelers: {type: integer, minimum: 1, description: Number of travelers or hotel guests.}
        confirmed: {type: boolean, default: false, description: Must be true only after explicit exact-payload confirmation.}
      required: [booking_type, option_id, start_date, travelers, confirmed]
